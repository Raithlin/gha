name: Publish architecture

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Export committed architecture
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Groma
        run: npm install --global groma.md@0.7.7

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Export reads the committed map and source; it does not scan or curate.
      - name: Export architecture
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: groma export "$RUNNER_TEMP/architecture-site" --revision HEAD --url "$PAGES_URL/"

      # Measure the exported revision; never consume coverage from a PR artifact.
      - name: Set up Go for coverage
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Measure statement coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate coverage badge data
        run: >-
          python3 -B tools/coverage/report.py --profile coverage.out
          --summary "$GITHUB_STEP_SUMMARY"
          --badge "$RUNNER_TEMP/architecture-site/coverage.json"
          --revision "$GITHUB_SHA"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/architecture-site

  deploy:
    name: Deploy architecture
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
