name: Go CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 2. Setup the Go environment
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod' # Automatically matches your go.mod version
          cache: true               # Caches Go modules for faster subsequent runs

      # 3. Download dependencies explicitly (useful for caching verification)
      - name: Download Go modules
        run: go mod download

      # 4. Verify go.mod and go.sum are completely up-to-date
      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code go.mod go.sum

      # 5. Run static analysis
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # 6. Run all unit tests
      - name: Test coverage reporting
        run: make test-coverage-report

      - name: Run tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      # Publish a measured total even when the following coverage gate fails.
      - name: Summarize statement coverage
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        run: python3 -B tools/coverage/report.py --profile coverage.out --summary "$GITHUB_STEP_SUMMARY" --revision "$GITHUB_SHA"

      # 7. Enforce the project's minimum statement coverage.
      - name: Enforce coverage threshold
        run: go tool cover -func=coverage.out | awk '/^total:/ { gsub("%", "", $3); if ($3 + 0 < 95) { printf "coverage %.1f%% is below the required 95%%\\n", $3; exit 1 } }'

      # The existing required job also guards architecture freshness on every PR.
      - name: Set up Node.js for Groma
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install pinned Groma
        run: npm install --global "groma.md@$(python3 tools/architecture/pr.py version)"

      - name: Test architecture workflow
        run: make test-architecture

      - name: Verify committed architecture is current
        run: make architecture-check
